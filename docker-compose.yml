
services:
  postgres:
    image: postgres:16-alpine
    container_name: kalora_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kalora_user
      POSTGRES_PASSWORD: kalora_password
      POSTGRES_DB: kalora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: